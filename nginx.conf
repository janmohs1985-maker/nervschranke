proxy_cache_path /var/cache/nginx/trips levels=1 keys_zone=trips:2m max_size=50m inactive=10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Transitous-Daten, 30 s zwischengespeichert (alle Besucher teilen sich eine Abfrage pro Minute)
    location = /api/trips {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=300s ipv6=off;
        proxy_pass https://api.transitous.org/api/v1/map/trips$is_args$args;
        proxy_set_header Host api.transitous.org;
        proxy_set_header User-Agent "bahn.mohs.es (Schranke Nersingen)";
        proxy_ssl_server_name on;
        proxy_cache trips;
        proxy_cache_key $args;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }

    location / { return 404; }
}
